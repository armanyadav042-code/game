<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle Wall Destroyer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Press+Start+2P&amp;display=swap');
        
        :root {
            --bg: #0f0f1a;
            --panel: #1a1a2e;
            --accent: #00f0ff;
            --gold: #ffd700;
            --neon-pink: #ff00aa;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', system_ui, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .top-bar {
            background: var(--panel);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--accent);
            z-index: 100;
        }
        
        .currency {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 22px;
        }
        
        .currency.gold {
            color: var(--gold);
        }
        
        .currency .icon {
            font-size: 26px;
        }
        
        .main-area {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        
        #wall-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        #wall {
            width: 380px;
            height: 380px;
            background: linear-gradient(#555, #333);
            border: 12px solid #222;
            border-radius: 20px;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3),
                        inset 0 0 60px rgba(0,0,0,0.6);
            transition: transform 0.05s ease;
            cursor: pointer;
            overflow: hidden;
        }
        
        #wall.broken {
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            transform: scale(0.2) rotate(25deg);
            opacity: 0;
        }
        
        .wall-material {
            position: absolute;
            inset: 0;
            background-size: cover;
            transition: background 0.3s ease;
        }
        
        .cracks {
            position: absolute;
            inset: 0;
            background: url('data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22380%22 height=%22380%22%3E%3Cpath fill=%22none%22 stroke=%22%23ffffff22%22 stroke-width=%223%22 d=%22M120 80 Q180 140 140 200 Q200 250 170 320%22/%3E%3Cpath fill=%22none%22 stroke=%22%23ffffff22%22 stroke-width=%223%22 d=%22M240 60 Q200 160 280 220 Q240 290 300 350%22/%3E%3C/svg%3E') center/cover;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        
        .wall-hp {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 18px;
            background: #222;
            border: 3px solid #444;
            border-radius: 9999px;
            overflow: hidden;
        }
        
        .hp-bar {
            height: 100%;
            background: linear-gradient(to right, #00ff88, var(--accent));
            width: 100%;
            transition: width 0.1s linear;
            box-shadow: 0 0 15px var(--accent);
        }
        
        .wall-label {
            position: absolute;
            bottom: -75px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            text-align: center;
            width: 100%;
        }
        
        .damage-number {
            position: absolute;
            font-weight: 700;
            font-size: 22px;
            color: #fff;
            text-shadow: 0 0 10px #fff,
                        2px 2px 0 #000;
            pointer-events: none;
            z-index: 200;
            animation: damage-pop 0.8s forwards;
        }
        
        @keyframes damage-pop {
            0% { transform: scale(0.6); opacity: 1; }
            40% { transform: scale(1.3); }
            100% { transform: scale(0.9); opacity: 0; }
        }
        
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 150;
            box-shadow: 0 0 8px #fff;
        }
        
        .nav-buttons {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            background: var(--panel);
            border-top: 3px solid #333;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-btn {
            background: #222;
            color: #fff;
            border: 3px solid #444;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        
        .nav-btn:hover {
            background: #333;
            border-color: var(--accent);
        }
        
        .nav-btn.active {
            background: var(--accent);
            color: #000;
            border-color: #fff;
        }
        
        .panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 26, 0.95);
            z-index: 300;
            padding: 20px;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .panel.active {
            display: flex;
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .panel-header h2 {
            font-size: 28px;
            color: var(--accent);
        }
        
        .close-btn {
            background: #333;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            font-size: 22px;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        
        .upgrade-card {
            background: #1f1f35;
            border: 3px solid #333;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.2s ease;
        }
        
        .upgrade-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        
        .upgrade-card h4 {
            font-size: 18px;
            margin-bottom: 6px;
        }
        
        .upgrade-card .cost {
            color: var(--gold);
            font-weight: 700;
        }
        
        .upgrade-card button {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background: #00cc88;
            border: none;
            color: #000;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
        }
        
        .world-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }
        
        .world-card {
            background: #1f1f35;
            border: 3px solid #333;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
        }
        
        .world-card.unlocked {
            border-color: var(--accent);
        }
        
        .world-card.current {
            background: #2a2a4a;
            border-color: var(--neon-pink);
        }
        
        .helper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        
        .helper-card {
            background: #1f1f35;
            border: 3px solid #444;
            padding: 14px;
            border-radius: 10px;
        }
        
        .achievement {
            background: #1f1f35;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .achievement.completed {
            border: 2px solid #00ff88;
        }
        
        .tool-icon {
            font-size: 42px;
            line-height: 1;
        }
        
        .damage-text {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .floating-text {
            position: absolute;
            font-weight: 700;
            pointer-events: none;
            z-index: 400;
            animation: float-up 1.2s forwards;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="currency gold">
                <span class="icon">🪙</span>
                <span id="coins">0</span>
            </div>
            <div class="currency" style="color:#a78bfa">
                <span class="icon">💎</span>
                <span id="prestige-points">0</span>
            </div>
            <div style="display:flex; align-items:center; gap:15px; font-size:15px;">
                <div>World: <span id="world-name">Wood</span></div>
                <div id="wall-count">Wall 1/10</div>
            </div>
        </div>
        
        <!-- Main Game Area -->
        <div class="main-area">
            <div id="wall-container">
                <!-- Wall -->
                <div id="wall" onclick="tapWall(event)">
                    <div id="wall-material" class="wall-material" style="background: linear-gradient(#8B5A2B, #5C4033);"></div>
                    <div id="wall-cracks" class="cracks"></div>
                    
                    <!-- Tool visual overlay -->
                    <div id="tool-overlay" style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;">
                        <div id="current-tool" style="font-size:92px; filter: drop-shadow(0 0 15px #fff); transition: transform 0.1s;">⛏️</div>
                    </div>
                    
                    <!-- HP Bar -->
                    <div class="wall-hp">
                        <div id="hp-bar" class="hp-bar" style="width:100%"></div>
                    </div>
                    <div id="wall-label" class="wall-label">Wood Wall • 100 HP</div>
                </div>
            </div>
            
            <!-- Floating damage container -->
            <div id="damage-container" style="position:absolute; inset:0; pointer-events:none; z-index:200;"></div>
        </div>
        
        <!-- Bottom Navigation -->
        <div class="nav-buttons">
            <button onclick="showPanel('upgrades')" class="nav-btn">UPGRADES</button>
            <button onclick="showPanel('tools')" class="nav-btn">TOOLS</button>
            <button onclick="showPanel('worlds')" class="nav-btn">WORLDS</button>
            <button onclick="showPanel('helpers')" class="nav-btn">HELPERS</button>
            <button onclick="showPanel('prestige')" class="nav-btn">PRESTIGE</button>
            <button onclick="showPanel('achievements')" class="nav-btn">ACHIEVEMENTS</button>
            <button onclick="showPanel('settings')" class="nav-btn">SETTINGS</button>
        </div>
        
        <!-- Panels -->
        
        <!-- Upgrades Panel -->
        <div id="panel-upgrades" class="panel">
            <div class="panel-header">
                <h2>⚙️ Upgrades</h2>
                <button onclick="hidePanel()" class="close-btn">×</button>
            </div>
            <div id="upgrade-list" class="upgrade-grid"></div>
        </div>
        
        <!-- Tools Panel -->
        <div id="panel-tools" class="panel">
            <div class="panel-header">
                <h2>🛠️ Tools</h2>
                <button onclick="hidePanel()" class="close-btn">×</button>
            </div>
            <div id="tools-list" class="helper-grid"></div>
        </div>
        
        <!-- Worlds Panel -->
        <div id="panel-worlds" class="panel">
            <div class="panel-header">
                <h2>🌍 Worlds</h2>
                <button onclick="hidePanel()" class="close-btn">×</button>
            </div>
            <div id="worlds-list" class="world-list"></div>
        </div>
        
        <!-- Helpers Panel -->
        <div id="panel-helpers" class="panel">
            <div class="panel-header">
                <h2>🤖 Helpers</h2>
                <button onclick="hidePanel()" class="close-btn">×</button>
            </div>
            <div id="helpers-list" class="helper-grid"></div>
        </div>
        
        <!-- Prestige Panel -->
        <div id="panel-prestige" class="panel">
            <div class="panel-header">
                <h2>✨ Prestige</h2>
                <button onclick="hidePanel()" class="close-btn">×</button>
            </div>
            <div style="max-width:520px; margin:0 auto; text-align:center;">
                <div style="font-size:18px; margin:20px 0; line-height:1.4;">
                    Reset all progress and earn <span id="prestige-gain" style="color:#a78bfa; font-weight:800;">0</span> Prestige Points.<br>
                    Each point gives a permanent <span style="color:#ffd700">+10%</span> damage multiplier.
                </div>
                <div style="margin:25px 0;">
                    <button onclick="prestigeReset()" style="padding:16px 48px; font-size:20px; background:#a78bfa; color:#000; border:none; border-radius:12px; font-weight:800;">PRESTIGE NOW</button>
                </div>
                <div style="font-size:15px; color:#888;">Current bonus: <span id="prestige-bonus">+0%</span></div>
            </div>
        </div>
        
        <!-- Achievements Panel -->
        <div id="panel-achievements" class="panel">
            <div class="panel-header">
                <h2>🏆 Achievements</h2>
                <button onclick="hidePanel()" class="close-btn">×</button>
            </div>
            <div id="achievements-list"></div>
        </div>
        
        <!-- Settings Panel -->
        <div id="panel-settings" class="panel">
            <div class="panel-header">
                <h2>⚙️ Settings</h2>
                <button onclick="hidePanel()" class="close-btn">×</button>
            </div>
            <div style="max-width:380px; margin:0 auto;">
                <div style="margin:20px 0;">
                    <label style="display:block; margin-bottom:8px;">Sound</label>
                    <input type="range" id="sound-vol" min="0" max="1" step="0.1" value="0.6" style="width:100%">
                </div>
                <div style="margin:20px 0;">
                    <label style="display:block; margin-bottom:8px;">Music</label>
                    <input type="range" id="music-vol" min="0" max="1" step="0.1" value="0.4" style="width:100%">
                </div>
                <div style="margin-top:40px;">
                    <button onclick="resetSave()" style="background:#c33; color:white; padding:12px 30px; border:none; border-radius:8px; width:100%;">RESET ALL PROGRESS</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ==================== GAME STATE ====================
        let game = {
            coins: 0,
            prestigePoints: 0,
            prestigeMultiplier: 1,
            
            // Damage stats
            tapDamage: 1,
            autoDamage: 0,
            critChance: 5,
            critDamage: 2.5,
            attackSpeed: 1,
            coinBonus: 1,
            offlineBonus: 1,
            
            // Progress
            currentWorld: 0,
            currentWallIndex: 0,
            wallsBroken: 0,
            
            // Unlocks
            unlockedTools: [0],
            unlockedHelpers: [],
            
            // Upgrades owned
            upgrades: {},
            
            // Helpers owned
            helpers: {},
            
            // Achievements
            achievements: {},
            
            // Timers
            lastSave: Date.now(),
            lastOffline: Date.now(),
            
            // Settings
            soundEnabled: true,
            musicEnabled: true
        };
        
        // ==================== GAME DATA ====================
        const worlds = [
            { name: "Wood", color: "#8B5A2B", hpBase: 100, reward: 15 },
            { name: "Stone", color: "#666666", hpBase: 450, reward: 60 },
            { name: "Metal", color: "#555577", hpBase: 2200, reward: 240 },
            { name: "Ice", color: "#aaddff", hpBase: 10500, reward: 1100 },
            { name: "Neon", color: "#ff00cc", hpBase: 52000, reward: 4800 },
            { name: "Lava", color: "#ff6600", hpBase: 240000, reward: 19000 },
            { name: "Crystal", color: "#88ffcc", hpBase: 1250000, reward: 85000 },
            { name: "Boss", color: "#9900ff", hpBase: 6500000, reward: 400000 }
        ];
        
        const tools = [
            { id: 0, name: "Pickaxe", icon: "⛏️", damageMult: 1.0, cost: 0 },
            { id: 1, name: "Drill", icon: "🛠️", damageMult: 2.2, cost: 450 },
            { id: 2, name: "Hammer", icon: "🔨", damageMult: 5.5, cost: 2400 },
            { id: 3, name: "Sledgehammer", icon: "🪓", damageMult: 13, cost: 12500 },
            { id: 4, name: "Laser Cutter", icon: "🔦", damageMult: 32, cost: 68000 },
            { id: 5, name: "Plasma Drill", icon: "⚡", damageMult: 85, cost: 340000 },
            { id: 6, name: "Bomb Launcher", icon: "💣", damageMult: 220, cost: 1700000 }
        ];
        
        const helpersData = [
            { id: 0, name: "Drone", icon: "🚁", baseDamage: 2, cost: 180, owned: 0 },
            { id: 1, name: "Auto Hammer", icon: "🔨", baseDamage: 8, cost: 1100, owned: 0 },
            { id: 2, name: "Laser Turret", icon: "🔫", baseDamage: 35, cost: 6200, owned: 0 },
            { id: 3, name: "Mini Bot", icon: "🤖", baseDamage: 140, cost: 29000, owned: 0 }
        ];
        
        const upgradesData = [
            { id: "tap", name: "Tap Damage", desc: "+1 tap damage", baseCost: 35, effect: () => game.tapDamage += 1 },
            { id: "auto", name: "Auto Damage", desc: "+2 auto damage", baseCost: 95, effect: () => game.autoDamage += 2 },
            { id: "crit", name: "Crit Chance", desc: "+4% crit chance", baseCost: 250, effect: () => game.critChance = Math.min(65, game.critChance + 4) },
            { id: "critdmg", name: "Crit Damage", desc: "+0.6x crit damage", baseCost: 580, effect: () => game.critDamage += 0.6 },
            { id: "speed", name: "Attack Speed", desc: "+15% attack speed", baseCost: 1200, effect: () => game.attackSpeed = Math.min(4, game.attackSpeed + 0.15) },
            { id: "coin", name: "Coin Bonus", desc: "+25% coin gain", baseCost: 2100, effect: () => game.coinBonus += 0.25 },
            { id: "offline", name: "Offline Income", desc: "+35% offline earnings", baseCost: 4200, effect: () => game.offlineBonus += 0.35 },
            { id: "helper", name: "Helper Power", desc: "+25% helper damage", baseCost: 8500, effect: () => {} }
        ];
        
        const achievementList = [
            { id: "walls10", name: "Wall Breaker", desc: "Break 10 walls", goal: 10, type: "walls", reward: 200 },
            { id: "walls100", name: "Demolition Expert", desc: "Break 100 walls", goal: 100, type: "walls", reward: 1200 },
            { id: "world3", name: "World Explorer", desc: "Reach World 3", goal: 3, type: "world", reward: 650 },
            { id: "prestige1", name: "Reborn", desc: "Prestige once", goal: 1, type: "prestige", reward: 2500 },
            { id: "upgrades15", name: "Upgrader", desc: "Buy 15 upgrades", goal: 15, type: "upgrades", reward: 800 },
            { id: "coins1m", name: "Millionaire", desc: "Earn 1,000,000 coins", goal: 1000000, type: "coins", reward: 4500 }
        ];
        
        let currentWallHP = 0;
        let currentWallMaxHP = 0;
        let lastTime = Date.now();
        let autoDamageInterval = null;
        
        // ==================== UTILITY FUNCTIONS ====================
        function formatNumber(num) {
            if (num < 1000) return Math.floor(num);
            if (num < 1000000) return (num / 1000).toFixed(1) + "K";
            if (num < 1000000000) return (num / 1000000).toFixed(1) + "M";
            return (num / 1000000000).toFixed(1) + "B";
        }
        
        function playSound(type) {
            if (!game.soundEnabled) return;
            
            // Simple Web Audio API sounds
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                if (type === "hit") {
                    oscillator.type = "sawtooth";
                    oscillator.frequency.value = 120 + Math.random() * 80;
                    gain.gain.value = 0.3;
                    setTimeout(() => { gain.gain.value = 0; }, 80);
                } else if (type === "break") {
                    oscillator.type = "square";
                    oscillator.frequency.value = 60;
                    gain.gain.value = 0.6;
                    setTimeout(() => { gain.gain.value = 0; }, 300);
                } else if (type === "buy") {
                    oscillator.type = "sine";
                    oscillator.frequency.value = 680;
                    gain.gain.value = 0.25;
                    setTimeout(() => { gain.gain.value = 0; }, 120);
                }
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = "lowpass";
                filter.frequency.value = 1200;
                
                oscillator.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                oscillator.start();
                setTimeout(() => oscillator.stop(), 400);
            } catch(e) {}
        }
        
        function createParticles(x, y, count = 12) {
            const container = document.getElementById("damage-container");
            
            for (let i = 0; i < count; i++) {
                const p = document.createElement("div");
                p.className = "particle";
                p.style.left = `${x + (Math.random() - 0.5) * 80}px`;
                p.style.top = `${y + (Math.random() - 0.5) * 80}px`;
                p.style.background = `hsl(${Math.random() * 40 + 20}, 100%, 80%)`;
                
                container.appendChild(p);
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 1.4 + Math.random() * 3.2;
                
                let life = 0;
                const anim = setInterval(() => {
                    life += 1;
                    if (life > 26) {
                        clearInterval(anim);
                        p.remove();
                        return;
                    }
                    p.style.left = `${parseFloat(p.style.left) + Math.cos(angle) * velocity}px`;
                    p.style.top = `${parseFloat(p.style.top) + Math.sin(angle) * velocity + life * 0.15}px`;
                    p.style.opacity = 1 - (life / 26);
                }, 16);
            }
        }
        
        function showDamageNumber(x, y, amount, isCrit = false) {
            const container = document.getElementById("damage-container");
            const num = document.createElement("div");
            
            num.className = "damage-number";
            num.style.left = `${x}px`;
            num.style.top = `${y}px`;
            num.style.color = isCrit ? "#ff00cc" : "#ffffff";
            num.style.fontSize = isCrit ? "27px" : "21px";
            num.innerHTML = formatNumber(amount);
            
            container.appendChild(num);
            
            setTimeout(() => {
                num.style.transition = "all 0.6s ease";
                num.style.transform = `translateY(-${40 + Math.random() * 50}px)`;
                num.style.opacity = "0";
                
                setTimeout(() => num.remove(), 600);
            }, 10);
        }
        
        // ==================== WALL SYSTEM ====================
        function getCurrentWallData() {
            const world = worlds[game.currentWorld];
            const wallNum = game.currentWallIndex + 1;
            const hp = Math.floor(world.hpBase * Math.pow(1.6, game.currentWallIndex));
            return { world, hp, reward: Math.floor(world.reward * Math.pow(1.35, game.currentWallIndex)) };
        }
        
        function setupWall() {
            const data = getCurrentWallData();
            currentWallMaxHP = data.hp;
            currentWallHP = data.hp;
            
            const wallEl = document.getElementById("wall");
            const materialEl = document.getElementById("wall-material");
            const labelEl = document.getElementById("wall-label");
            
            materialEl.style.background = `linear-gradient(${data.world.color}, #222)`;
            
            labelEl.innerHTML = `${data.world.name} Wall • ${formatNumber(currentWallMaxHP)} HP`;
            
            document.getElementById("world-name").innerText = data.world.name;
            document.getElementById("wall-count").innerText = `Wall ${game.currentWallIndex + 1}/10`;
            
            updateHPBar();
            
            wallEl.style.transition = "none";
            wallEl.style.transform = "scale(1)";
            wallEl.style.opacity = "1";
            wallEl.classList.remove("broken");
            
            setTimeout(() => {
                wallEl.style.transition = "transform 0.05s ease";
            }, 50);
        }
        
        function updateHPBar() {
            const percent = Math.max(0, Math.floor((currentWallHP / currentWallMaxHP) * 100));
            document.getElementById("hp-bar").style.width = percent + "%";
        }
        
        function breakWall() {
            const data = getCurrentWallData();
            const reward = Math.floor(data.reward * game.coinBonus);
            
            game.coins += reward;
            game.wallsBroken++;
            
            // Create big break particles
            const wallRect = document.getElementById("wall").getBoundingClientRect();
            createParticles(wallRect.left + 190, wallRect.top + 190, 38);
            
            playSound("break");
            
            // Wall break animation
            const wallEl = document.getElementById("wall");
            wallEl.classList.add("broken");
            
            // Reward popup
            const container = document.getElementById("damage-container");
            const rewardText = document.createElement("div");
            rewardText.className = "floating-text";
            rewardText.style.left = "50%";
            rewardText.style.top = "42%";
            rewardText.style.fontSize = "28px";
            rewardText.style.color = "#ffd700";
            rewardText.style.transform = "translate(-50%, -50%)";
            rewardText.innerHTML = `+${formatNumber(reward)} coins`;
            container.appendChild(rewardText);
            
            setTimeout(() => {
                rewardText.style.transition = "all 1.2s ease";
                rewardText.style.opacity = "0";
                setTimeout(() => rewardText.remove(), 800);
            }, 200);
            
            // Progress to next wall
            setTimeout(() => {
                game.currentWallIndex++;
                
                if (game.currentWallIndex >= 10) {
                    // Advance world
                    if (game.currentWorld < worlds.length - 1) {
                        game.currentWorld++;
                        game.currentWallIndex = 0;
                    } else {
                        // Max world reached, loop last wall with higher scaling
                        game.currentWallIndex = 8;
                    }
                }
                
                setupWall();
                checkAchievements();
                updateUI();
                saveGame();
            }, 650);
        }
        
        function damageWall(amount, isTap = false, x = null, y = null) {
            if (currentWallHP <= 0) return;
            
            let dmg = amount;
            let isCrit = false;
            
            if (isTap) {
                // Crit roll
                if (Math.random() * 100 < game.critChance) {
                    dmg = Math.floor(dmg * game.critDamage);
                    isCrit = true;
                }
            }
            
            currentWallHP = Math.max(0, currentWallHP - dmg);
            updateHPBar();
            
            // Visual feedback
            const wallEl = document.getElementById("wall");
            wallEl.style.transform = `scale(${isCrit ? 0.95 : 0.97})`;
            setTimeout(() => {
                wallEl.style.transform = "scale(1)";
            }, 70);
            
            // Show damage number
            const wallRect = wallEl.getBoundingClientRect();
            const posX = x || (wallRect.left + 190 + (Math.random() - 0.5) * 130);
            const posY = y || (wallRect.top + 110 + (Math.random() - 0.5) * 100);
            
            showDamageNumber(posX, posY, dmg, isCrit);
            
            // Particles
            if (isTap || Math.random() < 0.3) {
                createParticles(posX, posY, isCrit ? 8 : 4);
            }
            
            playSound("hit");
            
            if (currentWallHP <= 0) {
                breakWall();
            }
            
            updateUI();
        }
        
        function tapWall(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX;
            const y = e.clientY;
            
            const dmg = Math.floor(game.tapDamage * game.prestigeMultiplier * (tools[game.unlockedTools[game.unlockedTools.length-1]].damageMult || 1));
            damageWall(dmg, true, x, y);
        }
        
        // ==================== AUTO DAMAGE ====================
        function startAutoDamage() {
            if (autoDamageInterval) clearInterval(autoDamageInterval);
            
            autoDamageInterval = setInterval(() => {
                if (currentWallHP > 0 && game.autoDamage > 0) {
                    let autoDmg = game.autoDamage * game.prestigeMultiplier;
                    
                    // Apply helper damage
                    let helperBonus = 0;
                    Object.keys(game.helpers).forEach(key => {
                        const h = helpersData[parseInt(key)];
                        helperBonus += h.baseDamage * (game.helpers[key] || 0);
                    });
                    
                    autoDmg += helperBonus * game.prestigeMultiplier;
                    
                    damageWall(Math.floor(autoDmg));
                }
            }, 300);
        }
        
        // ==================== UPGRADES ====================
        function renderUpgrades() {
            const container = document.getElementById("upgrade-list");
            container.innerHTML = "";
            
            upgradesData.forEach(upg => {
                const owned = game.upgrades[upg.id] || 0;
                const cost = Math.floor(upg.baseCost * Math.pow(1.6, owned));
                
                const card = document.createElement("div");
                card.className = "upgrade-card";
                card.innerHTML = `
                    <h4>${upg.name} <span style="font-size:13px;opacity:0.6">(${owned})</span></h4>
                    <div style="font-size:13px;color:#aaa;margin:4px 0 10px;">${upg.desc}</div>
                    <div class="cost">🪙 ${formatNumber(cost)}</div>
                    <button onclick="buyUpgrade('${upg.id}', this)">BUY</button>
                `;
                container.appendChild(card);
            });
        }
        
        function buyUpgrade(id, btn) {
            const upg = upgradesData.find(u => u.id === id);
            const owned = game.upgrades[id] || 0;
            const cost = Math.floor(upg.baseCost * Math.pow(1.6, owned));
            
            if (game.coins < cost) return;
            
            game.coins -= cost;
            game.upgrades[id] = owned + 1;
            upg.effect();
            
            playSound("buy");
            btn.parentElement.style.transition = "all 0.1s";
            btn.parentElement.style.opacity = "0.3";
            
            setTimeout(() => {
                renderUpgrades();
                updateUI();
                checkAchievements();
                saveGame();
            }, 120);
        }
        
        // ==================== TOOLS ====================
        function renderTools() {
            const container = document.getElementById("tools-list");
            container.innerHTML = "";
            
            tools.forEach((tool, index) => {
                const unlocked = game.unlockedTools.includes(index);
                
                const card = document.createElement("div");
                card.className = "helper-card";
                card.style.borderColor = unlocked ? "#00ff88" : "#555";
                
                card.innerHTML = `
                    <div style="display:flex;align-items:center;gap:12px;">
                        <div class="tool-icon">${tool.icon}</div>
                        <div>
                            <div style="font-weight:700;">${tool.name}</div>
                            <div style="font-size:13px;color:#aaa;">${tool.damageMult}x damage</div>
                        </div>
                    </div>
                    <div style="margin-top:12px;">
                        ${unlocked ? 
                            `<div style="color:#00ff88;font-weight:700;">EQUIPPED</div>` : 
                            `<button onclick="unlockTool(${index}, this)" style="width:100%;padding:8px;">Unlock (${formatNumber(tool.cost)})</button>`
                        }
                    </div>
                `;
                
                container.appendChild(card);
            });
        }
        
        function unlockTool(index, btn) {
            const tool = tools[index];
            if (game.coins < tool.cost) return;
            
            game.coins -= tool.cost;
            game.unlockedTools.push(index);
            
            // Update current tool visual
            document.getElementById("current-tool").innerHTML = tool.icon;
            
            playSound("buy");
            renderTools();
            updateUI();
            saveGame();
        }
        
        // ==================== WORLDS ====================
        function renderWorlds() {
            const container = document.getElementById("worlds-list");
            container.innerHTML = "";
            
            worlds.forEach((world, index) => {
                const unlocked = index <= game.currentWorld;
                
                const card = document.createElement("div");
                card.className = `world-card ${unlocked ? "unlocked" : ""} ${index === game.currentWorld ? "current" : ""}`;
                
                card.innerHTML = `
                    <div style="font-size:22px;margin-bottom:4px;">${world.name}</div>
                    <div style="font-size:12px;color:#999;">${unlocked ? "UNLOCKED" : "LOCKED"}</div>
                `;
                
                if (unlocked) {
                    card.onclick = () => {
                        game.currentWorld = index;
                        game.currentWallIndex = 0;
                        setupWall();
                        renderWorlds();
                        hidePanel();
                    };
                }
                
                container.appendChild(card);
            });
        }
        
        // ==================== HELPERS ====================
        function renderHelpers() {
            const container = document.getElementById("helpers-list");
            container.innerHTML = "";
            
            helpersData.forEach((helper, index) => {
                const owned = game.helpers[index] || 0;
                const cost = Math.floor(helper.cost * Math.pow(1.65, owned));
                
                const card = document.createElement("div");
                card.className = "helper-card";
                card.innerHTML = `
                    <div style="display:flex;align-items:center;gap:12px;">
                        <div style="font-size:34px;">${helper.icon}</div>
                        <div style="flex:1">
                            <div style="font-weight:700;">${helper.name}</div>
                            <div style="font-size:13px;color:#aaa;">+${helper.baseDamage} auto dmg</div>
                        </div>
                    </div>
                    <div style="margin-top:10px; font-size:14px;">
                        <div>Owned: <span style="color:#ffd700">${owned}</span></div>
                        <button onclick="buyHelper(${index}, this)" style="margin-top:6px;width:100%;padding:8px;">Buy (${formatNumber(cost)})</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        function buyHelper(index, btn) {
            const helper = helpersData[index];
            const owned = game.helpers[index] || 0;
            const cost = Math.floor(helper.cost * Math.pow(1.65, owned));
            
            if (game.coins < cost) return;
            
            game.coins -= cost;
            game.helpers[index] = owned + 1;
            
            playSound("buy");
            renderHelpers();
            updateUI();
            saveGame();
        }
        
        // ==================== PRESTIGE ====================
        function calculatePrestigeGain() {
            return Math.floor(Math.sqrt(game.wallsBroken / 9));
        }
        
        function updatePrestigeUI() {
            document.getElementById("prestige-gain").innerText = calculatePrestigeGain();
            document.getElementById("prestige-bonus").innerText = `+${Math.floor((game.prestigeMultiplier - 1) * 100)}%`;
        }
        
        function prestigeReset() {
            const gain = calculatePrestigeGain();
            if (gain < 1) {
                alert("You need at least 1 prestige point to rebirth.");
                return;
            }
            
            if (!confirm("Are you sure you want to prestige? This will reset your progress.")) return;
            
            // Apply prestige bonus
            game.prestigePoints += gain;
            game.prestigeMultiplier = 1 + (game.prestigePoints * 0.1);
            
            // Reset game progress
            game.coins = 0;
            game.tapDamage = 1;
            game.autoDamage = 0;
            game.critChance = 5;
            game.critDamage = 2.5;
            game.attackSpeed = 1;
            game.coinBonus = 1;
            game.offlineBonus = 1;
            game.currentWorld = 0;
            game.currentWallIndex = 0;
            game.wallsBroken = 0;
            game.upgrades = {};
            game.helpers = {};
            game.unlockedTools = [0];
            
            document.getElementById("current-tool").innerHTML = "⛏️";
            
            setupWall();
            updatePrestigeUI();
            hidePanel();
            updateUI();
            saveGame();
        }
        
        // ==================== ACHIEVEMENTS ====================
        function checkAchievements() {
            let updated = false;
            
            achievementList.forEach(ach => {
                if (game.achievements[ach.id]) return;
                
                let progress = 0;
                if (ach.type === "walls") progress = game.wallsBroken;
                else if (ach.type === "world") progress = game.currentWorld + 1;
                else if (ach.type === "prestige") progress = game.prestigePoints;
                else if (ach.type === "upgrades") progress = Object.keys(game.upgrades).length;
                else if (ach.type === "coins") progress = game.coins;
                
                if (progress >= ach.goal) {
                    game.achievements[ach.id] = true;
                    game.coins += ach.reward;
                    showFloatingReward(ach.name, ach.reward);
                    updated = true;
                }
            });
            
            if (updated) updateUI();
        }
        
        function showFloatingReward(name, reward) {
            const el = document.createElement("div");
            el.style.cssText = "position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#222;border:3px solid #ffd700;padding:8px 22px;border-radius:9999px;font-size:15px;z-index:999";
            el.innerHTML = `🏆 ${name} +${reward} coins`;
            document.body.appendChild(el);
            
            setTimeout(() => {
                el.style.transition = "all 0.6s";
                el.style.opacity = "0";
                setTimeout(() => el.remove(), 500);
            }, 2300);
        }
        
        function renderAchievements() {
            const container = document.getElementById("achievements-list");
            container.innerHTML = "";
            
            achievementList.forEach(ach => {
                const completed = !!game.achievements[ach.id];
                
                const div = document.createElement("div");
                div.className = `achievement ${completed ? "completed" : ""}`;
                div.innerHTML = `
                    <div style="flex:1">
                        <div style="font-weight:700;">${ach.name}</div>
                        <div style="font-size:13px;color:#999;">${ach.desc}</div>
                    </div>
                    <div style="text-align:right;min-width:70px;">
                        ${completed ? `<span style="color:#00ff88">✓ +${ach.reward}</span>` : `<span style="color:#666">${ach.reward}</span>`}
                    </div>
                `;
                container.appendChild(div);
            });
        }
        
        // ==================== UI UPDATES ====================
        function updateUI() {
            document.getElementById("coins").innerText = formatNumber(game.coins);
            document.getElementById("prestige-points").innerText = game.prestigePoints;
            
            // Update current tool icon if not already set
            const toolEl = document.getElementById("current-tool");
            const latestTool = tools[game.unlockedTools[game.unlockedTools.length - 1]];
            if (toolEl.innerHTML !== latestTool.icon) {
                toolEl.innerHTML = latestTool.icon;
            }
        }
        
        function showPanel(panel) {
            hidePanel();
            document.getElementById("panel-" + panel).classList.add("active");
            
            if (panel === "upgrades") renderUpgrades();
            else if (panel === "tools") renderTools();
            else if (panel === "worlds") renderWorlds();
            else if (panel === "helpers") renderHelpers();
            else if (panel === "prestige") updatePrestigeUI();
            else if (panel === "achievements") renderAchievements();
        }
        
        function hidePanel() {
            document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        }
        
        // ==================== SAVE / LOAD ====================
        function saveGame() {
            localStorage.setItem("idleWallDestroyerSave", JSON.stringify(game));
        }
        
        function loadGame() {
            const saved = localStorage.getItem("idleWallDestroyerSave");
            if (saved) {
                const loaded = JSON.parse(saved);
                Object.assign(game, loaded);
                
                // Ensure tool icon is updated
                const latestTool = tools[game.unlockedTools[game.unlockedTools.length - 1]];
                document.getElementById("current-tool").innerHTML = latestTool.icon;
            }
        }
        
        function resetSave() {
            if (confirm("Reset ALL progress? This cannot be undone.")) {
                localStorage.removeItem("idleWallDestroyerSave");
                location.reload();
            }
        }
        
        function calculateOfflineEarnings() {
            const now = Date.now();
            const elapsed = (now - game.lastOffline) / 1000 / 60; // minutes
            
            if (elapsed > 1 && game.autoDamage > 0) {
                const estimatedWalls = Math.floor(elapsed * 1.8);
                const offlineCoins = Math.floor(estimatedWalls * 80 * game.offlineBonus * game.coinBonus);
                
                if (offlineCoins > 0) {
                    game.coins += offlineCoins;
                    const offlineMsg = document.createElement("div");
                    offlineMsg.style.cssText = "position:fixed;top:110px;left:50%;transform:translateX(-50%);background:#1a1a2e;border:3px solid #00f0ff;padding:10px 24px;border-radius:9999px;font-size:15px;z-index:999";
                    offlineMsg.innerHTML = `💤 Offline: +${formatNumber(offlineCoins)} coins`;
                    document.body.appendChild(offlineMsg);
                    
                    setTimeout(() => {
                        offlineMsg.style.transition = "all .6s";
                        offlineMsg.style.opacity = "0";
                        setTimeout(() => offlineMsg.remove(), 500);
                    }, 2800);
                }
            }
            
            game.lastOffline = now;
        }
        
        // ==================== GAME LOOP ====================
        function gameLoop() {
            const now = Date.now();
            const dt = (now - lastTime) / 1000;
            lastTime = now;
            
            // Auto save
            if (now - game.lastSave > 15000) {
                saveGame();
                game.lastSave = now;
            }
            
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }
        
        // ==================== INITIALIZATION ====================
        function init() {
            loadGame();
            calculateOfflineEarnings();
            
            // Start with first wall
            setupWall();
            
            // Start auto damage loop
            startAutoDamage();
            
            // Update UI
            updateUI();
            updatePrestigeUI();
            
            // Keyboard support (space to tap)
            document.addEventListener("keydown", function(e) {
                if (e.key === " " || e.key === "Spacebar") {
                    e.preventDefault();
                    const wall = document.getElementById("wall");
                    const rect = wall.getBoundingClientRect();
                    damageWall(Math.floor(game.tapDamage * game.prestigeMultiplier), true, 
                        rect.left + 190 + (Math.random() - 0.5) * 80, rect.top + 150);
                }
            });
            
            // Initial achievement check
            setTimeout(checkAchievements, 600);
            
            // Start main loop
            gameLoop();
            
            // Welcome message
            console.log("%c[Idle Wall Destroyer] Game initialized successfully.", "color:#555");
            
            // Auto-save on close
            window.addEventListener("beforeunload", saveGame);
        }
        
        // Boot the game
        window.onload = init;
    </script>
</body>
</html>
