<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a14">
<title>Idle Wall Destroyer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ======================= TITLE SCREEN ======================= -->
<div id="title-screen">
  <div class="title-bg-grid"></div>
  <div class="title-wall">🧱</div>
  <h1 class="game-logo"><span>IDLE</span><span class="logo-mid">WALL</span><span>DESTROYER</span></h1>
  <div class="title-tagline">Smash · Upgrade · Automate · Prestige</div>
  <button id="btn-start" class="btn-start">TAP TO START</button>
  <div class="title-hint">Hold the wall to attack continuously</div>
</div>

<!-- ======================= GAME ======================= -->
<div id="game" class="hidden">

  <!-- Top bar : currencies -->
  <header id="top-bar">
    <div class="currency gold" id="cur-coins" title="Coins"><span class="cur-icon">🪙</span><span id="coins-val">0</span></div>
    <div class="currency gems" id="cur-gems" title="Gems"><span class="cur-icon">💎</span><span id="gems-val">0</span></div>
    <div class="currency cores hidden" id="cur-cores" title="Prestige Cores"><span class="cur-icon">🔮</span><span id="cores-val">0</span></div>
    <div class="top-spacer"></div>
    <button id="btn-daily" class="icon-btn daily" title="Daily Chest">🎁</button>
  </header>

  <!-- Stats strip -->
  <div id="stats-strip">
    <span id="stat-tap">👊 0</span>
    <span id="stat-dps">⚡ 0/s</span>
    <span id="stat-world">🌍 —</span>
    <span id="stat-boost" class="hidden"></span>
  </div>

  <!-- Main play area -->
  <main id="main-area">
    <div id="world-bg"></div>
    <div id="shake-layer">

      <div id="wall-zone">
        <!-- boss banner -->
        <div id="boss-banner" class="hidden">💀 BOSS WALL 💀</div>

        <!-- helpers orbit around the wall -->
        <div id="helper-ring"></div>

        <!-- the wall itself -->
        <div id="wall">
          <div id="wall-face"></div>
          <canvas id="crack-canvas"></canvas>
          <div id="wall-flash"></div>
        </div>

        <!-- active tool sprite -->
        <div id="tool-sprite">⛏️</div>

        <!-- combo indicator -->
        <div id="combo-box" class="hidden">
          <div id="combo-count">x0</div>
          <div class="combo-label">COMBO</div>
        </div>
      </div>

      <!-- HP bar + stage navigation -->
      <div id="hp-block">
        <div id="wall-name">Wooden Wall</div>
        <div id="hp-row">
          <button id="btn-stage-prev" class="stage-nav" title="Previous wall">◀</button>
          <div id="hp-bar"><div id="hp-fill"></div><span id="hp-text">10 / 10</span></div>
          <button id="btn-stage-next" class="stage-nav" title="Next wall">▶</button>
        </div>
        <div id="stage-pips"></div>
      </div>
    </div>

    <!-- FX canvas covers the whole play area -->
    <canvas id="fx-canvas"></canvas>
    <!-- floating damage numbers live here -->
    <div id="float-layer"></div>
  </main>

  <!-- Slide-up / side panel -->
  <section id="panel" class="closed">
    <div id="panel-head">
      <h2 id="panel-title">Upgrades</h2>
      <button id="panel-close" class="icon-btn">✕</button>
    </div>
    <div id="panel-body"></div>
  </section>

  <!-- Bottom navigation -->
  <nav id="bottom-nav">
    <button class="nav-btn" data-tab="upgrades"><span class="nav-ico">⬆️</span><span class="nav-lbl">Upgrades</span></button>
    <button class="nav-btn" data-tab="tools"><span class="nav-ico">⛏️</span><span class="nav-lbl">Tools</span></button>
    <button class="nav-btn" data-tab="helpers"><span class="nav-ico">🤖</span><span class="nav-lbl">Helpers</span></button>
    <button class="nav-btn" data-tab="worlds"><span class="nav-ico">🌍</span><span class="nav-lbl">Worlds</span></button>
    <button class="nav-btn" data-tab="prestige"><span class="nav-ico">🔮</span><span class="nav-lbl">Prestige</span></button>
    <button class="nav-btn" data-tab="awards"><span class="nav-ico">🏆</span><span class="nav-lbl">Awards</span></button>
    <button class="nav-btn" data-tab="settings"><span class="nav-ico">⚙️</span><span class="nav-lbl">Options</span></button>
  </nav>

  <!-- Toast notifications -->
  <div id="toast-zone"></div>

  <!-- Generic modal (offline earnings / daily chest / confirms) -->
  <div id="modal-veil" class="hidden">
    <div id="modal-card">
      <div id="modal-icon">🎁</div>
      <h3 id="modal-title">Welcome back!</h3>
      <div id="modal-body"></div>
      <div id="modal-actions"></div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
